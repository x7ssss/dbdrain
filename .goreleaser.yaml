# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: dbdrain

before:
  hooks:
    - go mod tidy

builds:
  - id: dbdrain
    main: ./cmd/dbdrain
    binary: dbdrain
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

brews:
  - name: dbdrain
    repository:
      owner: x7ssss
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@dbdrain.io
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/x7ssss/dbdrain"
    description: "Zero-downtime PostgreSQL, MySQL/MariaDB & SQLite database subsetting, polymorphic FK resolution & deterministic PII masking"
    license: "MIT"
    install: |
      bin.install "dbdrain"
    test: |
      system "#{bin}/dbdrain --help"

scoops:
  - name: dbdrain
    repository:
      owner: x7ssss
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@dbdrain.io
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/x7ssss/dbdrain"
    description: "Zero-downtime PostgreSQL, MySQL/MariaDB & SQLite database subsetting, polymorphic FK resolution & deterministic PII masking"
    license: "MIT"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
